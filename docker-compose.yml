services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: timetable_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TTS_DB_USER: ${TTS_DB_USER:?set TTS_DB_USER in .env}
      TTS_DB_PASSWORD: ${TTS_DB_PASSWORD:?set TTS_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - timetable-db:/var/lib/postgresql/data

volumes:
  timetable-db:
